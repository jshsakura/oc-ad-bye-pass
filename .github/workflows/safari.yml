# Safari 확장을 iOS 앱으로 변환·빌드한다.
#
# **맥이 없어도 된다.** macos 러너가 Xcode 를 들고 있다.
#
# 두 단계로 나뉘고, 두 번째는 서명 자격이 있을 때만 돈다.
#
#   1. 변환 검증 (항상)  — dist-safari/ → Xcode 프로젝트 → 서명 없이 빌드
#      Linux 에서는 절대 확인할 수 없는 것을 본다: 우리 매니페스트가 실제로
#      Safari 확장으로 변환되는가, 빌드가 통과하는가.
#
#   2. 서명·IPA (secrets 있을 때) — Ad Hoc 서명 → .ipa + manifest.plist
#      adbyepass.opencourse.kr 에 올리면 아이폰에서 OTA 설치가 된다.
#
# 필요한 secrets (2단계용, 전부 있어야 한다):
#   BUILD_CERTIFICATE_P12       배포 인증서 .p12 를 base64 로
#   P12_PASSWORD                그 .p12 비밀번호
#   PROVISIONING_PROFILE        Ad Hoc 프로비저닝 프로파일 .mobileprovision 을 base64 로
#   KEYCHAIN_PASSWORD           임시 키체인 비밀번호 (아무 문자열)
#   APPLE_TEAM_ID               10자리 팀 ID
#
# 없으면 1단계까지만 돌고 성공으로 끝난다 — 그게 정상이다.

name: safari

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/manifest.json'
      - 'scripts/**'
      - '.github/workflows/safari.yml'

env:
  APP_NAME: OC Ad Bye-Pass
  BUNDLE_ID: com.jshsakura.ocadbyepass

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:safari

      # Linux CI 가 못 하는 유일한 검증
      - name: Xcode 프로젝트로 변환
        run: |
          xcrun safari-web-extension-converter dist-safari \
            --project-location safari \
            --app-name "$APP_NAME" \
            --bundle-identifier "$BUNDLE_ID" \
            --swift --ios-only --no-open --force --no-prompt
          echo "--- 생성된 스킴 ---"
          xcodebuild -list -project "safari/$APP_NAME/$APP_NAME.xcodeproj"

      - name: 서명 없이 빌드 (변환 결과가 실제로 컴파일되는지)
        run: |
          xcodebuild build \
            -project "safari/$APP_NAME/$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME (iOS)" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet

      # 미서명 IPA — 여기가 "애플 계정 없이 아이폰에 올리는" 경로다.
      #
      # AltStore / SideStore 는 IPA 를 받아 **사용자의 무료 Apple ID 로 직접 재서명**한다.
      # 그래서 우리가 서명할 필요가 없다. 7일마다 갱신해야 하지만 SideStore 는
      # 최초 1회 PC 설정 뒤로는 무선으로 알아서 갱신한다.
      #
      # IPA 는 그냥 Payload/ 안에 .app 을 넣고 zip 한 것이다. 규격이 그게 전부다.
      - name: 미서명 IPA 로 포장
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" \
                  -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::빌드 산출물(.app)을 못 찾았다"; exit 1; }
          echo "찾은 앱: $APP"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload" ota
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/ota/oc-ad-bye-pass-unsigned.ipa" Payload)
          ls -lh ota/

      - name: 서명 자격이 있는지 확인
        id: signing
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_P12 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::서명 secrets 가 없어 변환 검증까지만 했다. IPA 는 만들지 않는다."
          fi

      # --- 여기부터는 서명 자격이 있을 때만 ---

      - name: 키체인에 인증서·프로파일 설치
        if: steps.signing.outputs.ready == 'true'
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          echo -n "$CERT" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROFILE" | base64 --decode \
            -o ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Ad Hoc 서명으로 IPA 만들기
        if: steps.signing.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST

          xcodebuild archive \
            -project "safari/$APP_NAME/$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME (iOS)" \
            -sdk iphoneos -configuration Release \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -quiet

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export"

          mkdir -p ota
          cp "$RUNNER_TEMP"/export/*.ipa "ota/oc-ad-bye-pass.ipa"

      - name: OTA 매니페스트 생성
        if: steps.signing.outputs.ready == 'true'
        run: |
          node scripts/ota-manifest.mjs \
            --ipa-url "https://adbyepass.opencourse.kr/ota/oc-ad-bye-pass.ipa" \
            --bundle-id "$BUNDLE_ID" \
            --title "$APP_NAME" \
            --out ota/manifest.plist
          echo "--- manifest.plist ---"
          cat ota/manifest.plist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-ios
          path: |
            ota/
            dist-safari/
          retention-days: 14
          if-no-files-found: warn

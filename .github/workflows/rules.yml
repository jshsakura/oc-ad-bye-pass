name: rules

# Rebuilds the network blocklist from the upstream public lists.
#
# The lists move constantly — new ad networks appear, old domains get reused for
# something innocent. A blocklist frozen at build time decays quietly: nobody
# notices missing blocks, and a stale entry that starts blocking a real site
# reads as "the extension broke my page".
#
# This does not push to main. Rules are shipped inside the extension package, so
# a change here is a change to what every user runs — it opens a pull request and
# waits for a human. The diff is the review: a sudden collapse in domain count,
# or a well-known site appearing, is visible before it ships.

on:
  schedule:
    # Weekly, Monday 04:00 UTC. The lists do not move fast enough to warrant more,
    # and every run costs a pull request somebody has to read.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Rebuild the blocklist
        run: node scripts/build-rules.mjs

      # A collapse in coverage means an upstream list moved or started serving an
      # error page. Shipping that would silently switch blocking off.
      - name: Sanity-check the result
        run: |
          node -e "
            const fs = require('fs');
            const meta = JSON.parse(fs.readFileSync('public/rules/ads.meta.json', 'utf8'));
            const rules = JSON.parse(fs.readFileSync('public/rules/ads.json', 'utf8'));
            const domains = new Set(rules.flatMap(r => r.condition.requestDomains ?? []));
            console.log(\`\${domains.size} domains across \${rules.length} rules\`);

            if (domains.size < 50000) {
              console.error('coverage collapsed — an upstream list is probably broken');
              process.exit(1);
            }
            for (const required of ['doubleclick.net', 'googlesyndication.com', 'adnxs.com']) {
              if (!domains.has(required)) {
                console.error(\`missing a network the list is pointless without: \${required}\`);
                process.exit(1);
              }
            }
            for (const forbidden of ['youtube.com', 'google.com', 'github.com']) {
              if (domains.has(forbidden)) {
                console.error(\`would block a site people need: \${forbidden}\`);
                process.exit(1);
              }
            }
          "

      - run: npm run check && npm test

      # Pushed, not proposed.
      #
      # This opened a pull request until 2026-09-07, and every run since at
      # least 2026-08-17 failed on "GitHub Actions is not permitted to create or
      # approve pull requests" — a repository setting, not anything in the
      # branch. Four consecutive Mondays produced a pushed branch, a red run,
      # and no review, while main sat 20,005 domains short of the upstream
      # lists. A review that cannot happen is not a review.
      #
      # What made the pull request feel necessary is above this line and still
      # runs: the sanity check refuses a collapse in coverage, refuses a list
      # missing the networks it would be pointless without, and refuses one that
      # would block youtube.com or google.com — then the suite runs. And unlike
      # filters/, this file is bundled rather than fetched, so nothing here
      # reaches anyone until a release is cut by hand.
      #
      # If the setting is turned on later and review is wanted back, the git
      # history has the create-pull-request step.
      - name: 바뀌었으면 커밋한다
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/rules/ads.json public/rules/ads.meta.json
          if git diff --cached --quiet; then
            echo '바뀐 것 없음'
            exit 0
          fi
          git commit -m "$(printf 'Refresh the network blocklist from upstream lists\n\nRebuilt by scripts/build-rules.mjs. Data only, and bundled rather than\nfetched, so it reaches people with the next release rather than on its\nown.')"
          # 같은 시각에 도는 다른 자동 커밋과 부딪히면 그 위로 얹는다.
          git pull --rebase --autostash origin main
          git push

name: filters

# 한국 필터 리스트 미러링.
#
# 세 개의 원본은 각자의 일정으로 갱신된다 — List-KR 은 매일, 나머지는 수시로.
# 확장을 다시 배포하지 않아도 사용자에게 닿아야 하므로, 여기서 만든 결과를
# 저장소에 커밋하고 확장은 그것을 원격 리스트로 받아간다. 릴리스와 무관하게
# 도는 파이프가 이미 있으니 새로 만들지 않고 그 위에 싣는다.
#
# 원본이 죽거나 응답이 이상하면 커밋하지 않는다. 반쯤 받은 리스트를 커밋하면
# 그 순간 모든 사용자의 차단 규칙이 그만큼 줄어들고, 아무도 눈치채지 못한다.

on:
  schedule:
    # 매일 04:00 UTC (한국 오후 1시). List-KR 이 매일 도는 것보다 뒤에 둔다.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filters
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 원본을 받아 우리 형식으로 굽는다
        run: node scripts/build-filters.mjs

      # 만들어진 것이 확장이 실제로 받아들이는 것인지 확인한다. 검증기가 거절할
      # 규칙을 커밋하면 그 줄들은 사용자에게 도달한 뒤 조용히 사라진다.
      - name: 확장의 검증기를 통과하는지
        run: node scripts/verify-filters.mjs

      - name: 바뀌었으면 커밋한다
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add filters/korea.json filters/list.json
          if git diff --cached --quiet; then
            echo '바뀐 것 없음'
            exit 0
          fi
          git commit -m "$(printf 'Mirror the Korean lists as they stand today\n\nGenerated by scripts/build-korea.mjs from List-KR (GPL-3.0), YousList\n(CC BY 4.0) and 애드가드 갤러리 필터 (Apache-2.0). The extension fetches\nfilters/list.json on its own schedule, so this reaches people without a\nrelease.')"
          git push

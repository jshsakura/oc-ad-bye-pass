name: audit

# 진짜 유튜브에 대고 두 가지를 주기적으로 실측한다 — 광고가 아직 보이는가,
# 그리고 확장이 기대는 것들이 아직 거기 있는가.
#
# 이 확장이 깨지는 방식은 하나뿐이다 — 유튜브가 바뀌는 것. 코드는 그대로인데
# 어느 날 갑자기 안 막힌다. push 기반 CI 는 이걸 절대 못 잡는다. 아무도 push 를
# 안 해도 깨지기 때문이다. 그래서 시간이 트리거다.
#
# 메인 CI 에 넣지 않는 이유: 실제 네트워크를 타서 느리고, 광고 노출이 지역·시점에
# 따라 달라진다. 매 push 마다 돌리면 관계없는 PR 이 남의 사정으로 빨개진다.

on:
  schedule:
    # 매일 03:00 UTC (한국 정오)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run build:firefox
      - run: npx playwright install --with-deps chromium

      - name: 광고 누출 실측
        id: audit
        continue-on-error: true
        run: node scripts/audit-ads.mjs --json audit-report.json

      # The other half. audit-ads asks whether ads still get through; this asks
      # whether the things the rest of the extension hangs off are still there —
      # the player's caption API, the response shape layer 1 reads, the video
      # element the PiP button attaches to — and it asks on m.youtube too, which
      # nothing else here looks at.
      #
      # It fails only on a contract that provably broke. Anything it cannot
      # observe from a signed-out headless browser is reported as unobservable
      # and passes, because a monitor that cries wolf gets muted.
      - name: 기능 계약 실측
        id: features
        continue-on-error: true
        run: node scripts/audit-features.mjs --json feature-report.json

      # The Firefox package, in a Firefox, against the live site. The offline
      # half of this same script gates every push and every release; this is the
      # half that needs youtube.com, and it lives here with the other live checks
      # for the same reason they do — a network hiccup should page someone, not
      # block a release.
      - name: 파이어폭스 실측
        id: firefox
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=~/.cache/oc-firefox; mkdir -p "$D"; cd "$D"
          curl -sSL -o ff.tar.xz 'https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US'
          tar xf ff.tar.xz
          gh release download --repo mozilla/geckodriver --pattern '*linux64.tar.gz' -O geckodriver.tar.gz
          tar xzf geckodriver.tar.gz
          cd "$GITHUB_WORKSPACE"
          node scripts/smoke-firefox.mjs 2>&1 | tee firefox-report.txt
          exit "${PIPESTATUS[0]}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-report
          path: |
            audit-report.json
            feature-report.json
            firefox-report.txt
          retention-days: 30

      # 누출이 있으면 이슈로 알린다. 이미 열려 있으면 댓글만 단다 —
      # 매일 새 이슈가 쌓이면 아무도 안 본다.
      - name: 누출을 이슈로 알린다
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="광고 누출 감지 — 필터 규칙 갱신 필요"
          body="$(printf '유튜브가 바뀌어서 광고가 새고 있습니다.\n\n실행: %s\n\n```json\n%s\n```\n\n고치는 법: 팝업의 "요소 고르기" 로 그 요소를 짚어 셀렉터를 얻은 뒤, `filters/video.json` 의 해당 그룹에 넣고 `version` 을 올려 push 하면 됩니다. 재설치는 필요 없습니다 — 확장이 알아서 받아 갑니다.\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$(cat audit-report.json)")"

          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            # Assigned, not merely opened.
            #
            # An issue from github-actions[bot] with nobody on it reaches the
            # owner only through repository watching, which is a setting that
            # can be turned off and that buries a real alert among everything
            # else the repo does. An assignment notifies regardless and lands
            # in "Assigned to you", which is a list short enough to read.
            #
            # The fallback matters: `gh issue create` fails outright on an
            # assignee it cannot resolve, and losing the whole alert because of
            # the name on it would be worse than an unassigned one.
            gh issue create --title "$title" --body "$body" --assignee "$OWNER" \
              || gh issue create --title "$title" --body "$body"
          fi

      # 기능 쪽은 따로 알린다. 광고 누출과 원인도 고치는 법도 다르다 —
      # 저쪽은 셀렉터를 더하면 되고, 이쪽은 코드가 기대던 것이 사라진 것이다.
      - name: 깨진 계약을 이슈로 알린다
        if: steps.features.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="기능 계약 깨짐 — 코드 수정 필요"
          body="$(printf '유튜브가 바뀌어서 확장이 기대던 것이 사라졌습니다. 셀렉터를 더해서 될 일이 아니라 코드를 고쳐야 합니다.\n\n실행: %s\n\n```json\n%s\n```\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$(cat feature-report.json)")"

          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            # Assigned, not merely opened.
            #
            # An issue from github-actions[bot] with nobody on it reaches the
            # owner only through repository watching, which is a setting that
            # can be turned off and that buries a real alert among everything
            # else the repo does. An assignment notifies regardless and lands
            # in "Assigned to you", which is a list short enough to read.
            #
            # The fallback matters: `gh issue create` fails outright on an
            # assignee it cannot resolve, and losing the whole alert because of
            # the name on it would be worse than an unassigned one.
            gh issue create --title "$title" --body "$body" --assignee "$OWNER" \
              || gh issue create --title "$title" --body "$body"
          fi

      # 파이어폭스는 따로 알린다. 저 둘은 유튜브가 바뀐 것이고, 이쪽은 Gecko 가
      # 바뀌었거나 우리 파이어폭스 패키지가 깨진 것이라 보는 파일이 다르다.
      - name: 파이어폭스 깨짐을 이슈로 알린다
        if: steps.firefox.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="파이어폭스에서 깨짐 — Gecko 실측 실패"
          body="$(printf '최신 Firefox 에서 파이어폭스 패키지가 실측을 통과하지 못했습니다. Firefox 가 바뀌었거나 dist-firefox 가 깨진 것입니다. 로컬 재현: `npm run smoke:firefox` (scripts/smoke-firefox.mjs 머리의 안내로 Firefox·geckodriver 를 받아둔 뒤).\n\n실행: %s\n\n```\n%s\n```\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$(tail -40 firefox-report.txt 2>/dev/null || echo '리포트 없음 — 스크립트가 시작도 못 했다')")"

          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            # Assigned, with the same fallback as the two above and for the same reason.
            gh issue create --title "$title" --body "$body" --assignee "$OWNER" \
              || gh issue create --title "$title" --body "$body"
          fi

      # 리포트가 없거나 스크립트 자체가 터진 경우도 조용히 넘기지 않는다
      - name: 결과 반영
        if: steps.audit.outcome == 'failure' || steps.features.outcome == 'failure' || steps.firefox.outcome == 'failure'
        run: |
          echo "감사에서 문제가 나왔습니다. 위 이슈를 확인하세요." >&2
          exit 1

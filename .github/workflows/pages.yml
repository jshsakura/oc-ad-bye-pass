# Publishes site/ to GitHub Pages — https://jshsakura.github.io/oc-ad-bye-pass/
#
# The page is static and holds no build output. Its download buttons point at
# `releases/latest/download/...`, so a new release changes what people get
# without this workflow running at all.
#
# It does not run on `release: published` — that trigger never fires, because a
# release made by softprops/action-gh-release is created with GITHUB_TOKEN and
# events raised by that token start no further runs. It does not need to: the
# packages here are built from this commit, so the page hands out its own
# version rather than reporting somebody else's.
#
# What gets published:
#   site/**              the page and its fonts
#   filters/list.json    the rule list, for reading
#   build.json           filter version for the footer
#
# It does not build or serve the packages. It did for a while, on the theory
# that the cross-host redirect to a release asset was mangling downloads on
# iOS — it was not. Orion's installer is simply intermittent, and building here
# only meant the page could hand out a different version from the release
# without anything saying so.

name: pages

on:
  # Every push to main, not just the ones that touch site/. The page ships the
  # packages it builds, so a commit that changes only src/ still changes what
  # this hands out — filtering by path left the download a version behind the
  # release, silently, which is the exact failure this project moved to
  # release-driven distribution to avoid.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Do not cancel one in flight — a half-published
# site is worse than a slightly late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/filters
          cp -R site/. _site/
          cp filters/list.json _site/filters/list.json

          # Fallback only. The page asks the releases API for the version it
          # actually links to; this is what shows when that call cannot be made.
          version=$(node -p "require('./package.json').version")

          node -e '
            const fs = require("fs");
            const list = JSON.parse(fs.readFileSync("filters/list.json", "utf8"));
            const pad = (n) => String(n).padStart(2, "0");
            const d = new Date();
            const today = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
            fs.writeFileSync("_site/build.json", JSON.stringify({
              version: process.argv[1],
              filterVersion: list.version,
              filterUpdatedAt: list.updatedAt || today,
              builtAt: today,
            }, null, 2) + "\n");
          ' "$version"
          cat _site/build.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

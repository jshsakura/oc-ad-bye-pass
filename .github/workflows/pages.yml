# Publishes site/ to GitHub Pages — https://jshsakura.github.io/oc-ad-bye-pass/
#
# The page is static and holds no build output. Its download buttons point at
# `releases/latest/download/...`, so a new release changes what people get
# without this workflow running at all.
#
# It does not run on `release: published` — that trigger never fires, because a
# release made by softprops/action-gh-release is created with GITHUB_TOKEN and
# events raised by that token start no further runs. It does not need to: the
# packages here are built from this commit, so the page hands out its own
# version rather than reporting somebody else's.
#
# What gets published:
#   site/**              the page and its fonts
#   filters/youtube.json the rule list, for reading
#   dl/*.zip             the packages themselves, built here
#   build.json           footer data, generated below
#
# The zips are served from this origin on purpose. Linking
# releases/latest/download/... sends a phone through a cross-host redirect to a
# URL whose name never changes while its contents do, which is exactly the shape
# a cache mangles — and a half-downloaded zip installs as "Something went
# wrong", with no way to tell it from a bad package.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'filters/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Do not cancel one in flight — a half-published
# site is worse than a slightly late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:all
      - run: npm run verify

      # The version goes in the file name. On a phone the downloaded file is the
      # only thing you can actually see, and "which build did I just install"
      # was otherwise unanswerable — every failure looks identical, whether the
      # package is wrong, the download was truncated, or the file picked was a
      # stale copy from an earlier attempt.
      - name: Package
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p _site/dl
          (cd dist && zip -qr "../_site/dl/oc-ad-bye-pass-$version.zip" .)
          (cd dist-orion && zip -qr "../_site/dl/oc-ad-bye-pass-orion-$version.zip" .)
          ls -l _site/dl

      # Three packages that differ by one thing each, for when an install fails
      # and the error says only "Something went wrong". A phone cannot tell a bad
      # package from a truncated download from the wrong file picked out of a
      # list, so the packages have to differ by something we control.
      #
      #   a  v0.4.0 exactly — the build known to have installed
      #   b  v0.4.0's files with the current version number
      #   c  the current build
      #
      # a fails  → not us; Orion or the device changed under us
      # a works, b fails → the version string, or something about replacing
      # b works, c fails → our code, and the range is v0.4.0..HEAD
      - name: Bisect packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p _site/dl/test work
          gh release download v0.4.0 -p 'oc-ad-bye-pass-orion.zip' -O work/a.zip
          cp work/a.zip "_site/dl/test/a-known-good-0.4.0.zip"

          rm -rf work/b && mkdir work/b && (cd work/b && unzip -q ../a.zip)
          node -e "
            const fs = require('fs');
            const p = 'work/b/manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            m.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
          " "$version"
          (cd work/b && zip -qr "../../_site/dl/test/b-old-files-new-version-$version.zip" .)

          cp "_site/dl/oc-ad-bye-pass-orion-$version.zip" "_site/dl/test/c-current-$version.zip"

          # And the releases in between, for when c is the one that fails. Each
          # is that release's own package with the one manifest line that was
          # later reverted taken back out, so what is left between them is code.
          for tag in v0.5.0 v0.6.0 v0.7.0; do
            rm -rf work/t && mkdir work/t
            gh release download "$tag" -p 'oc-ad-bye-pass-orion.zip' -O work/t.zip || continue
            (cd work/t && unzip -q ../t.zip)
            node -e "
              const fs = require('fs');
              const p = 'work/t/manifest.json';
              const m = JSON.parse(fs.readFileSync(p, 'utf8'));
              m.host_permissions = m.host_permissions.filter((h) => !h.includes('jshsakura.github.io'));
              fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
            "
            (cd work/t && zip -qr "../../_site/dl/test/d-code-${tag}.zip" .)
            rm -f work/t.zip
          done

          # And one that isolates the icons: today's code wearing v0.4.0's icons.
          # They are hand-encoded PNGs from scripts/make-icons.mjs — same format
          # as the ones that installed, but a stricter parser than Chromium's is
          # exactly the sort of thing that would not say so.
          rm -rf work/e && mkdir work/e
          (cd work/e && unzip -q "../../_site/dl/oc-ad-bye-pass-orion-$version.zip")
          rm -rf work/a-icons && mkdir work/a-icons
          (cd work/a-icons && unzip -q ../a.zip 'icons/*')
          cp work/a-icons/icons/*.png work/e/icons/
          (cd work/e && zip -qr "../../_site/dl/test/e-current-with-old-icons-$version.zip" .)

          ls -l _site/dl/test

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/filters
          cp -R site/. _site/
          cp filters/youtube.json _site/filters/youtube.json

          # Also the cache-buster for the download links: the file names are
          # stable and their contents are not.
          # The zips above are built from this commit, so the page's own version
          # is the one it hands out — not whatever the newest tag happens to be.
          version=$(node -p "require('./package.json').version")
          echo "version = $version"

          node -e '
            const fs = require("fs");
            const list = JSON.parse(fs.readFileSync("filters/youtube.json", "utf8"));
            const pad = (n) => String(n).padStart(2, "0");
            const d = new Date();
            const today = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
            fs.writeFileSync("_site/build.json", JSON.stringify({
              version: process.argv[1],
              filterVersion: list.version,
              filterUpdatedAt: list.updatedAt || today,
              builtAt: today,
            }, null, 2) + "\n");
          ' "$version"
          cat _site/build.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

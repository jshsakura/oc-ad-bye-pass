name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 필터 리스트가 깨진 채로 릴리스되면 모두의 갱신이 실패한다
      - run: npm run check
      - run: npm test

      - run: npm run build

      # 광고가 실제로 막히지 않는 빌드는 내보내지 않는다
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - name: manifest 버전을 태그와 맞춘다
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const path = 'dist/manifest.json';
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            manifest.version = '$version';
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: zip 으로 묶기
        run: cd dist && zip -qr "../oc-ad-bye-pass-${GITHUB_REF_NAME:-dev}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: oc-ad-bye-pass
          path: '*.zip'

      - name: Release 에 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          body: |
            ## 설치

            1. 아래 zip 을 받아 압축을 풉니다.
            2. Chrome 에서 `chrome://extensions` 를 엽니다.
            3. 우측 상단 **개발자 모드**를 켭니다.
            4. **압축해제된 확장 프로그램을 로드**를 눌러 압축 푼 폴더를 선택합니다.

            이미 설치돼 있다면 같은 폴더에 덮어쓰고 `chrome://extensions` 에서 새로고침하세요.

            > 차단 규칙만 바뀐 경우에는 재설치가 필요 없습니다 — 확장이 6시간마다
            > `filters/youtube.json` 을 알아서 받아갑니다.

# Builds the zip people install and attaches it to the GitHub release.
#
# **The release is the distribution.** The site (GitHub Pages) links to
# the releases API, matching assets by name, so the name carries the version:
#
#   oc-ad-bye-pass-vX_Y_Z.zip   One package for Chrome, Edge and Orion.
#
# There used to be a second, stripped package for Orion, built on the belief
# that Orion refused a manifest declaring declarativeNetRequest. On 2026-08-19
# the full package installed on a real iPhone — Orion shows a one-time
# compatibility warning and runs it fine — so the split was retired. The orion
# build target is kept in scripts/targets.mjs as a manual fallback only.
#
# The version is in the filename because a fixed name is how a phone ends up
# handing the browser a zip it downloaded weeks ago.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # workflow_dispatch 로 pages.yml 을 깨우기 위해서만 쓴다.
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, so the store step can tell whether this one is the newest.
          # The default shallow checkout has none of them.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 필터 리스트가 깨진 채로 릴리스되면 모두의 갱신이 실패한다
      - run: npm run check
      - run: npm test

      - run: npm run build
      - run: npm run build:firefox

      # The failure mode this catches: the package still installs and only one
      # layer is dead, with nothing reported.
      - run: npm run verify

      # AMO runs this same linter on upload and refuses the version on an error,
      # which would land *after* the tag is cut and the release is public. Errors
      # fail the build; warnings are printed and allowed through (the two
      # innerHTML sites are constant strings, and setExtensionActionOptions is
      # already behind a typeof guard for Orion's sake).
      - name: AMO 린터로 파이어폭스 패키지를 검사한다
        # Pinned to a major: the linter's own releases must not decide when this
        # build breaks. Bump on purpose, with the AMO change that motivates it.
        run: npx --yes addons-linter@10 dist-firefox

      # The linter proves the manifest parses. This proves the extension runs:
      # a real Firefox installs the package, the event page seeds settings, the
      # DNR ruleset is enabled, the popup draws. Three versions went to AMO on
      # inference alone before this existed; nothing Firefox-shaped leaves this
      # job again without having run in Firefox.
      #
      # Offline only, deliberately. A gate has to be deterministic or it gets
      # bypassed the first time youtube.com hiccups during a release; the live
      # half runs in audit.yml, which this job dispatches at the end, next to
      # the Chromium live check that already lives there for the same reason.
      - name: 파이어폭스 패키지를 진짜 파이어폭스에서 돌린다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=~/.cache/oc-firefox; mkdir -p "$D"; cd "$D"
          curl -sSL -o ff.tar.xz 'https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US'
          tar xf ff.tar.xz
          # Through gh with the job token, not the anonymous releases API: that
          # API allows 60 calls an hour per address, and hosted runners share
          # addresses. The 403 it returns would fail a release for no reason of
          # ours, on a schedule of other people's builds.
          gh release download --repo mozilla/geckodriver --pattern '*linux64.tar.gz' -O geckodriver.tar.gz
          tar xzf geckodriver.tar.gz
          cd "$GITHUB_WORKSPACE"
          node scripts/smoke-firefox.mjs --no-live

      # 광고가 실제로 막히지 않는 빌드는 내보내지 않는다
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test

      # The version is what a user reads on the extensions page to tell whether
      # the thing on their phone is the thing they just downloaded, so a stale
      # 0.1.0 in there is a real cost.
      - name: manifest 버전을 태그와 맞춘다
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            for (const dir of ['dist', 'dist-firefox']) {
              const path = dir + '/manifest.json';
              const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
              manifest.version = '$version';
              fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
              console.log(path + ' → ' + manifest.version);
            }
          "

      # Chromium writes its compiled ruleset cache into the extension directory
      # it was pointed at, so running the E2E suite leaves a 5MB
      # `_metadata/generated_indexed_rulesets/` inside dist/. Zipped as-is it
      # doubled the download and shipped a reserved `_`-prefixed directory that
      # a packager is entitled to reject — v0.2.0 went out like that.
      #
      # Removing it beats reordering the build after the tests: the artifact
      # then really is the thing the tests ran against.
      - name: 테스트가 남긴 브라우저 캐시 제거
        run: |
          rm -rf dist/_metadata
          # `_locales` is the one underscore directory the format sanctions —
          # it carries the manifest's localized name/description and both the
          # store and Orion accept it. Everything else with a `_` prefix is the
          # browser's own cache junk and must not ship.
          ! find dist -name '_*' -not -path '*/_locales*' -print | grep . || {
            echo "::error::예약된 _ 이름이 남아 있다 (위 목록)"; exit 1; }

      # 파일 이름에 버전이 들어간다.
      #
      # 이름이 고정이면 폰이 예전에 받아둔 같은 이름의 zip 을 그대로 넘긴다 —
      # Orion 의 "Extensions Error" 대부분이 이것이고, 캐시를 지워야 풀리는 것도
      # 이 때문이다. 이름이 매번 다르면 재사용할 파일 자체가 없고, Files 앱에서
      # 어느 빌드를 골랐는지도 눈으로 확인된다.
      #
      # 사이트와 설치 스크립트는 릴리스 API 로 자산을 찾으므로 이름이 바뀌어도
      # 따라온다. 이름을 고정으로 두던 이유(`latest/download/<이름>.zip`)는
      # 그 경로를 쓰지 않게 되면서 사라졌다.
      - name: zip 으로 묶기
        run: |
          # 점을 언더바로. 이름 가운데의 `.` 을 확장자로 읽는 파일 선택기가
          # 있고, 설치가 막히는 원인을 찾는 동안 변수를 하나라도 줄여둔다.
          v="$(printf '%s' "${GITHUB_REF_NAME:-dev}" | tr '.' '_')"
          (cd dist && zip -qr "../oc-ad-bye-pass-$v.zip" .)
          # Named apart from the Chrome package on purpose: the two are not
          # interchangeable, and a phone that has both in its downloads folder
          # should not have to guess which is which.
          (cd dist-firefox && zip -qr "../oc-ad-bye-pass-firefox-$v.zip" .)
          ls -lh ./*.zip
          unzip -l "oc-ad-bye-pass-$v.zip"
          unzip -l "oc-ad-bye-pass-firefox-$v.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: oc-ad-bye-pass
          path: '*.zip'

      - name: Release 에 첨부
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: '*.zip'
          # 아직 공개 프로젝트가 아니다. 모든 릴리스는 실험적이고, GitHub 이
          # "Latest" 로 승격해 지나가던 사람에게 완성품처럼 보이게 두지 않는다.
          prerelease: true
          name: '실험적 ${{ github.ref_name }}'
          body: |
            > **실험적 빌드입니다.** 아직 공개 프로젝트가 아니며, 이 버전이 동작한다는
            > 보장이 없습니다. 되돌릴 이전 버전을 함께 받아두는 편이 좋습니다.

            설치 안내: https://jshsakura.github.io/oc-ad-bye-pass/

            **패키지는 하나입니다.** `oc-ad-bye-pass-…zip` 한 파일로 Chrome · Edge · Orion
            을 모두 지원합니다. 파일 이름에 버전이 들어가 있어 어느 빌드를 받았는지
            파일 앱에서 바로 확인할 수 있습니다.

            ## 아이폰 · 아이패드 (Orion)

            1. App Store 에서 **Orion Browser by Kagi** 를 설치합니다.
            2. 위의 zip 을 받습니다.
            3. Orion 우측 하단 **•••** → **Extensions** → **+** 로 그 zip 을 고릅니다.
            4. **호환성 경고가 한 번 뜹니다. 정상입니다.** Orion 이 지원하지 않는
               네트워크 차단 API 를 알리는 것뿐이고, 계속을 누르면 설치됩니다.
               유튜브 광고 차단과 광고 숨기기는 전부 동작합니다.

            설치가 **"Extensions Error / Something went wrong"** 으로 튕기면 파일 문제가
            아닙니다. 순서대로 해보세요.

            1. **파일** 앱에서 zip 을 **나의 iPhone → 다운로드**로 **복사**합니다
               (갓 받은 파일이 기기에 완전히 안 내려와 있으면 같은 에러가 납니다)
            2. Orion 을 앱 스위처에서 위로 밀어 **완전히 종료**합니다
            3. Extensions 에서 **기존 것을 먼저 지웁니다** (덮어쓰기 설치는 안 됩니다)
            4. **+** 로 그 로컬 파일을 고릅니다. 그래도 막히면 설정에서 캐시를 지웁니다

            ## Chrome · Edge

            1. 같은 zip 을 받아 압축을 풉니다.
            2. `chrome://extensions` 를 엽니다.
            3. 우측 상단 **개발자 모드**를 켭니다.
            4. **압축해제된 확장 프로그램을 로드**를 눌러 압축 푼 폴더를 선택합니다.

            **압축 푼 폴더는 지우거나 옮기지 마세요** — 크롬이 그 폴더를 계속 참조합니다.
            이미 설치돼 있다면 같은 폴더에 덮어쓰고 `chrome://extensions` 에서 새로고침하세요.

            > 차단 규칙만 바뀐 경우에는 재설치가 필요 없습니다 — 확장이 6시간마다
            > `filters/list.json` 을 알아서 받아갑니다.

      # 릴리스가 만들어진 뒤에. 페이지는 최신 릴리스의 자산을 그대로 복사해 가므로
      # 이 순서가 뒤집히면 한 버전 뒤진 것을 집어간다.
      #
      # GITHUB_TOKEN 이 만든 이벤트는 다른 워크플로를 트리거하지 못하지만
      # workflow_dispatch 는 API 호출이라 동작한다 — pages.yml 이 release 를
      # 듣지 못하는 이유가 그것이고, 이것이 그 우회다.
      - name: 페이지가 이 릴리스를 집어가게 한다
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || true

      # 같은 zip 을 크롬 웹스토어에도 올려 게시(심사 제출)까지 한다.
      #
      # 시크릿 세 개가 전부 있어야 동작한다 — 없으면 건너뛰고 릴리스는 그대로
      # 성공한다. 발급 방법은 README 의 "스토어 자동 게시" 절에 있다.
      # 게시는 곧바로 공개가 아니라 스토어 심사 큐에 들어가는 것이고, 업데이트
      # 심사는 보통 최초 심사보다 빠르다.
      #
      # **실패해도 릴리스를 막지 않는다** (`continue-on-error`). GitHub 릴리스가
      # 정본이고 스토어는 그 사본이다 — 스토어 쪽 사정(심사 거절, API 장애,
      # 토큰 만료)으로 zip 배포와 사이트 갱신까지 멈추면 안 된다. 그래서 이
      # 단계는 페이지 트리거 뒤에 둔다.
      #
      # 다만 조용히 실패하면 안 된다. `continue-on-error` 는 런 전체를 초록으로
      # 만들기 때문에, 스토어에 아무것도 안 올라간 릴리스가 성공으로 보인다.
      # v0.14.0 과 v0.15.0 이 실제로 그렇게 나갔다 (둘 다 403 — 클라우드
      # 프로젝트에서 Chrome Web Store API 가 꺼져 있었다). 그래서 결과를
      # ::warning:: 과 잡 요약에 남긴다. 둘 다 초록 런에서도 눈에 띈다.
      # Is this the newest tag in the repository?
      #
      # Re-pushing an old tag re-runs this whole workflow, and the store step
      # would then offer the store a build older than the one already on it.
      # The store refuses a lower version, so the damage is noise rather than a
      # downgrade — but noise on a green run is how a real warning gets ignored,
      # and there is no reason to ask at all.
      #
      # Tag moves happen: a filter-mirror commit landing between a push and a
      # tag means a rebase, and the tag is left behind on the old commit.
      - name: 이 태그가 최신인지 확인한다
        if: startsWith(github.ref, 'refs/tags/v')
        id: newest
        run: |
          newest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          echo "저장소에서 가장 높은 태그: $newest / 지금: $GITHUB_REF_NAME"
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME 은 최신 태그가 아니라($newest) 스토어에는 올리지 않습니다. 릴리스 자산은 그대로 갱신됩니다."
          fi

      - name: 크롬 웹스토어에 올리고 게시한다
        if: startsWith(github.ref, 'refs/tags/v') && steps.newest.outputs.newest == 'true'
        continue-on-error: true
        env:
          EXTENSION_ID: aoehenpbglodadbbhaiaipmaklnkoeam
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "스토어 시크릿이 없어 건너뜁니다 — CWS_CLIENT_ID · CWS_CLIENT_SECRET · CWS_REFRESH_TOKEN"
            exit 0
          fi
          v="$(printf '%s' "$GITHUB_REF_NAME" | tr '.' '_')"
          if npx --yes chrome-webstore-upload-cli@3 upload \
               --source "oc-ad-bye-pass-$v.zip" --auto-publish; then
            echo "✅ 크롬 웹스토어 게시 제출: \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=스토어 게시 실패::$GITHUB_REF_NAME 이 크롬 웹스토어에 올라가지 않았습니다. GitHub 릴리스는 정상입니다. API 를 고친 뒤 store.yml 을 돌리면 새 태그 없이 다시 올릴 수 있습니다."
            {
              echo "⚠️ **크롬 웹스토어 게시 실패** — \`$GITHUB_REF_NAME\`"
              echo ""
              echo "GitHub 릴리스와 사이트는 정상입니다. 스토어에는 이전 버전이 그대로 걸려 있습니다."
              echo "원인을 고친 뒤 \`store.yml\` 워크플로를 이 태그로 돌리면 새 태그 없이 다시 올라갑니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # 나간 것을 곧바로 실제 유튜브에 대고 확인한다.
      #
      # 감사는 하루 한 번 도는데, 그 주기는 "유튜브가 바뀌었나" 를 보는 것이다.
      # 릴리스 직후는 다른 질문이다 — "우리가 방금 뭘 깨뜨렸나". 크론만 있으면
      # 그 답을 최대 24시간 기다려야 하고, 그동안 깨진 빌드가 스토어 심사를
      # 지나 사용자에게 내려간다.
      #
      # `--ref` 가 태그인 것이 중요하다. main 으로 돌리면 릴리스 뒤에 들어온
      # 커밋을 검사하게 되고, 그건 나간 것이 아니다. 필터 봇이 하루에 한 번
      # 커밋하므로 실제로 어긋날 수 있다.
      #
      # 실패하면 감사 워크플로가 이슈를 연다. 여기서 릴리스를 실패시키지 않는
      # 이유는 zip 이 이미 나갔기 때문이다 — 되돌릴 수 없는 것을 빨갛게 칠하는
      # 대신, 무엇이 깨졌는지 이슈로 남기는 편이 고치는 데 쓸모 있다.
      # AMO is a review queue, not a publish button: this uploads the version and
      # a human looks at it. Two things it deliberately does not try to do —
      #
      #   the first listing   A brand-new add-on needs a name, summary,
      #                       categories and a licence, and those live in the
      #                       AMO web form, not in the manifest. Create the
      #                       listing by hand once; every version after it comes
      #                       through here.
      #   the source upload   AMO asks for source when the package is bundled or
      #                       minified, which ours is. There is no API flag for
      #                       it — attach the source archive in the review UI.
      - name: 파이어폭스 애드온(AMO)에 올린다
        if: startsWith(github.ref, 'refs/tags/v') && steps.newest.outputs.newest == 'true'
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "AMO 시크릿이 없어 건너뜁니다 — AMO_JWT_ISSUER · AMO_JWT_SECRET"
            exit 0
          fi
          # `--approval-timeout 0` is what makes this step mean what it says.
          # Without it web-ext uploads and then waits for the add-on to be
          # *approved*, which for a queue-reviewed listing never happens inside a
          # CI run: v0.24.0 uploaded fine, sat for the full 15 minutes, and then
          # reported "did not upload" — a false failure on a version that was
          # already on AMO, at the cost of a quarter hour every release.
          if npx --yes web-ext@8 sign \
               --source-dir dist-firefox \
               --channel listed \
               --approval-timeout 0 \
               --api-key "$AMO_JWT_ISSUER" \
               --api-secret "$AMO_JWT_SECRET" \
               --no-input; then
            echo "✅ AMO 심사 제출: \`$GITHUB_REF_NAME\` (심사 대기)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=AMO 업로드 실패::$GITHUB_REF_NAME 이 AMO 에 올라가지 않았습니다. GitHub 릴리스는 정상이고, firefox zip 은 자산에 붙어 있습니다."
            {
              echo "⚠️ **AMO 업로드 실패** — \`$GITHUB_REF_NAME\`"
              echo ""
              echo "릴리스 자산의 \`oc-ad-bye-pass-firefox-*.zip\` 을 AMO 에 직접 올리면 됩니다."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Edge takes the Chrome package unchanged — same manifest, same ruleset,
      # same bundle. There is no edge build target and there should not be one;
      # what differs is only which store the same zip is handed to.
      #
      # The upload and the publish are both asynchronous and both fail *after*
      # they answer, so scripts/publish-edge.mjs polls each to a terminal state
      # rather than trusting the 202. Without that a green run means nothing.
      - name: 엣지 애드온즈에 올리고 게시한다
        if: startsWith(github.ref, 'refs/tags/v') && steps.newest.outputs.newest == 'true'
        continue-on-error: true
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          v="$(printf '%s' "$GITHUB_REF_NAME" | tr '.' '_')"
          # Three outcomes, not two. Treating "skipped" as success is how the
          # summary came to claim a publish to a store holding no credentials.
          node scripts/publish-edge.mjs "oc-ad-bye-pass-$v.zip" && code=0 || code=$?
          if [ "$code" = 0 ]; then
            echo "✅ 엣지 애드온즈 게시 제출: \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" = 75 ]; then
            echo "· 엣지 시크릿이 없어 건너뜀 — 스토어는 이전 버전 그대로입니다"
          else
            echo "::warning title=엣지 게시 실패::$GITHUB_REF_NAME 이 엣지 애드온즈에 올라가지 않았습니다. GitHub 릴리스와 크롬 웹스토어는 별개로 진행됩니다."
            {
              echo "⚠️ **엣지 애드온즈 게시 실패** — \`$GITHUB_REF_NAME\`"
              echo ""
              echo "위 스텝 로그에 errorCode 가 찍혀 있습니다. 이전 제출이 심사 중이면 (\`InProgressSubmission\`) 심사가 끝난 뒤 다시 돌리면 됩니다."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 나간 빌드를 실제 유튜브에 대고 검사한다
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run audit.yml --ref "$GITHUB_REF_NAME" \
            && echo "감사를 $GITHUB_REF_NAME 로 걸었습니다" >> "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::감사를 걸지 못했습니다 — 크론이 다음 정오에 잡습니다"


name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      # Safari 빌드. dist-safari/ 로 나가므로 아래 E2E 가 쓰는 dist/ 는 그대로다.
      - run: npm run build:safari

      # 타깃 분기가 조용히 무너지는 두 가지를 막는다.
      #  - Safari 매니페스트에 world:MAIN 이 남으면 Safari 가 그걸 무시하고
      #    main.js 를 ISOLATED 로 돌린다 (오류 없이 1계층만 죽는다)
      #  - Chrome 번들에 Safari 전용 코드가 남으면 define 인라인이 깨진 것이다
      - name: 타깃 분기 검증
        run: node scripts/verify-targets.mjs

      # Orion(WebKit)은 WebExtensions API 를 약 70%만 구현했다. 안 되는 API 를 쓰면
      # 오류 없이 조용히 기능만 죽는다 — Chrome 에서는 멀쩡하니 눈치채기 어렵다.
      # 표를 못 받으면 실패시키지 않고 건너뛴다 (남의 인프라에 CI 를 묶지 않는다).
      - name: Orion API 호환성 검사
        run: node scripts/check-orion-api.mjs

      # 실제 Chromium 에 확장을 물려서 광고가 정말 막히는지 본다
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

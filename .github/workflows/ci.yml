name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      # 조용히 무너지는 것들을 막는다 — 정적 world:MAIN 선언, 런타임 등록 경로,
      # 주입 폴백, 네트워크 계층. 어느 하나가 빠져도 확장은 멀쩡해 보인다.
      # E2E 앞에 둔다: E2E 가 dist/ 에 브라우저 캐시를 남긴다.
      - run: npm run verify

      # Orion(WebKit)은 WebExtensions API 를 약 70%만 구현했다. 안 되는 API 를 쓰면
      # 오류 없이 조용히 기능만 죽는다 — Chrome 에서는 멀쩡하니 눈치채기 어렵다.
      # 표를 못 받으면 실패시키지 않고 건너뛴다 (남의 인프라에 CI 를 묶지 않는다).
      - name: Orion API 호환성 검사
        run: node scripts/check-orion-api.mjs

      # 실제 Chromium 에 확장을 물려서 광고가 정말 막히는지 본다
      # WebKit as well as Chromium. Chromium is the only engine that loads an
      # extension, so it runs the product; WebKit is the engine people actually
      # install this on, and e2e/12 checks the techniques hold there.
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
